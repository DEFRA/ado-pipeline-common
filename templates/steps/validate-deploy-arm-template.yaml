parameters:
  - name: templatePath
    displayName: Path containing template file
    type: string
  - name: templateName
    displayName: Name of the template
    type: string
  - name: parameterFilePath
    displayName: Path containing Parameter file
    type: string
    default: ''
  - name: templateType
    type: string
    default: ''
  - name: scope
    displayName: Deployment Scope
    type: string
    values:
      - 'Management Group'
      - 'Subscription'
      - 'Resource Group'
  - name: deploy
    displayName: Deploy template? If false, will only validate.
    type: boolean
    default: false
  - name: whatIf
    displayName: Run WhatIf Analysis.
    type: boolean
    default: false
  - name: location
    displayName: Azure location
    type: string
  - name: resourceGroup
    displayName: Azure Resource Group
    type: string
  - name: connection
    displayName: Azure service connection
    type: string
  - name: tokenReplaceEscapeConfig
    type: string
    default: ''
  - name: tokenReplaceRootDirectory
    displayName: Optional root directory for replace-tokens (use when templatePath/parameterFilePath are under a different root, e.g. $(Pipeline.Workspace)/s/self)
    type: string
    default: ''
  - name: templatePathRelative
    displayName: Template path relative to tokenReplaceRootDirectory (use with tokenReplaceRootDirectory so replace-tokens resolves patterns under that root)
    type: string
    default: ''
  - name: parameterFilePathRelative
    displayName: Parameter file path relative to tokenReplaceRootDirectory
    type: string
    default: ''

steps:

  # When tokenReplaceRootDirectory and relative paths are set, use relative patterns so qetza task writes under that root (fixes Linux/multi-repo layout).
  - template: /templates/steps/replace-tokens.yaml
    parameters:
      rootDirectorylocation: ${{ coalesce(parameters.tokenReplaceRootDirectory, '$(Build.SourcesDirectory)') }}
      ${{ if and(ne(parameters.tokenReplaceRootDirectory, ''), ne(parameters.templatePathRelative, '')) }}:
        ${{ if ne(parameters.parameterFilePathRelative, '') }}:
          targetFileslocation: |
            ${{ parameters.templatePathRelative }}/*.parameters.json => *.transformed.parameters.json
            ${{ parameters.templatePathRelative }}/*.bicepparam => *.transformed.bicepparam
            ${{ parameters.parameterFilePathRelative }}/*.parameters.json => *.transformed.parameters.json
            ${{ parameters.parameterFilePathRelative }}/*.bicepparam => *.transformed.bicepparam
        ${{ else }}:
          targetFileslocation: |
            ${{ parameters.templatePathRelative }}/*.parameters.json => *.transformed.parameters.json
            ${{ parameters.templatePathRelative }}/*.bicepparam => *.transformed.bicepparam
      ${{ else }}:
        ${{ if ne(parameters.parameterFilePath, '') }}:
          targetFileslocation: |
            ${{ parameters.templatePath }}/*.parameters.json => *.transformed.parameters.json
            ${{ parameters.templatePath }}/*.bicepparam => *.transformed.bicepparam
            ${{ parameters.parameterFilePath }}/*.parameters.json => *.transformed.parameters.json
            ${{ parameters.parameterFilePath }}/*.bicepparam => *.transformed.bicepparam
        ${{ else }}:
          targetFileslocation: |
            ${{ parameters.templatePath }}/*.parameters.json => *.transformed.parameters.json
            ${{ parameters.templatePath }}/*.bicepparam => *.transformed.bicepparam
      escapeType: ${{ parameters.tokenReplaceEscapeConfig }}

  - template: /templates/steps/powershell.yaml
    parameters:
      azureResourceManagerConnection: ${{ parameters.connection }}
      scriptsList:
        - scriptRepo: PipelineCommonFiles
          ${{ if and(eq(parameters.deploy, true), eq(parameters.whatIf, false)) }}:
            displayName: Deploy - ${{ parameters.templateName }}
          ${{ if and(eq(parameters.deploy, false), eq(parameters.whatIf, false)) }}:
            displayName: Validate - ${{ parameters.templateName }}
          ${{ if eq(parameters.whatIf, true) }}:
            displayName: WhatIf - ${{ parameters.templateName }}
          scriptPath: templates/powershell/Template-Deployment.ps1
          Type: AzureCLI
          AzureCLIScriptType: pscore
          ${{ if and(eq(parameters.deploy, true), eq(parameters.whatIf, false)) }}:
            retryCountOnTaskFailure: 2
          ${{ if ne(parameters.parameterFilePath, '') }}:
            scriptArguments: >
                -TemplateFile "${{ parameters.templatePath }}/${{ parameters.templateName }}.${{ coalesce(parameters.templateType, 'json') }}"
                -ParameterFilePath "${{ parameters.parameterFilePath }}"
                -Location "${{ parameters.location }}"
                -ResourceGroupName "${{ coalesce(parameters.resourceGroup, '') }}"
                -Deploy $${{ parameters.deploy }}
                -WhatIf $${{ parameters.whatIf }}
          ${{ else }}:
            scriptArguments: >
                -TemplateFile "${{ parameters.templatePath }}/${{ parameters.templateName }}.${{ coalesce(parameters.templateType, 'json') }}"
                -Location "${{ parameters.location }}"
                -ResourceGroupName "${{ coalesce(parameters.resourceGroup, '') }}"
                -Deploy $${{ parameters.deploy }}
                -WhatIf $${{ parameters.whatIf }}