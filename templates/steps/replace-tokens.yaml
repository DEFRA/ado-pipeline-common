parameters:
  - name: rootDirectorylocation
    type: string
    default: ''
  - name: targetFileslocation
    type: string
  - name: escapeType
    type: string
    default: auto
    values: 
    - auto
    - none
    - json
    - xml
steps:
  # v6 required when rootDirectorylocation is custom (e.g. $(Pipeline.Workspace)/s/self): v5 does not resolve source paths from root on all agents
  - task: qetza.replacetokens.replacetokens-task.replacetokens@6
    displayName: Replace Variables
    inputs:
      ${{ if ne(parameters.rootDirectorylocation, '') }}:
        root: ${{ parameters.rootDirectorylocation }}
      sources: ${{ parameters.targetFileslocation }}
      encoding: auto
      addBOM: true
      missingVarAction: none
      missingVarLog: warn
      tokenPattern: custom
      tokenPrefix: '#{{'
      tokenSuffix: '}}'
      telemetryOptout: true
      transforms: true
      # escape: v6 uses off|auto|json|xml (v5 'none' -> 'off')
      escape: ${{ replace(parameters.escapeType, 'none', 'off') }}